name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # The feature store's tests (DESIGN.md, "Day 3"): on the project's port, as locally.
      redis:
        image: redis:8
        ports:
          - 6383:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      # The Redis tests fail instead of skipping when the service is missing.
      SIGNALREC_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The CPU-only PyTorch wheel first: PyPI's Linux wheel pulls in CUDA libraries (gigabytes) no job uses.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest

  # The whole pipeline on the real ml-latest-small: downloaded from GroupLens by its pinned SHA-256 (cached under that
  # hash, so GroupLens is asked once), never uploaded anywhere. The results must match the committed ones.
  movielens-small:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Day 4's serving chain on real data needs the feature store.
      redis:
        image: redis:8
        ports:
          - 6383:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      # The real-data tests fail instead of skipping when this dataset is missing.
      SIGNALREC_REQUIRE_DATA: ml-latest-small
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The CPU-only PyTorch wheel first: PyPI's Linux wheel pulls in CUDA libraries (gigabytes) no job uses.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[dev]'
      - name: Cache the archive by its pinned SHA-256
        uses: actions/cache@v6
        with:
          path: data/zips/ml-latest-small.zip
          key: movielens-ml-latest-small-696d65a3dfceac7c45750ad32df2c259311949efec81f0f144fdfb91ebc9e436
      - name: Download (or verify the cached copy) and extract
        run: signalrec download ml-latest-small
      - name: Real-data tests
        run: pytest -k real_ tests/test_movielens.py tests/test_prepare.py -rs
      - name: Prepare and run the baselines
        run: |
          signalrec prepare ml-latest-small
          signalrec baselines ml-latest-small --out "$RUNNER_TEMP/baselines.json"
      - name: Compare with the committed results
        run: python scripts/compare_results.py results/ml-latest-small/baselines.json "$RUNNER_TEMP/baselines.json"
      - name: Measure the leakage and compare with the committed results
        run: |
          signalrec leakage ml-latest-small --out "$RUNNER_TEMP/leakage.json"
          python scripts/compare_results.py results/ml-latest-small/leakage.json "$RUNNER_TEMP/leakage.json"
      # Both two-tower commands end to end on real data, briefly. Their numbers aren't compared with the committed
      # ones: those came from an Apple M3, this is x86-64, and nothing makes float training identical across CPUs.
      - name: Two-tower smoke run (2 epochs, two configurations, one seed)
        run: |
          signalrec twotower ml-latest-small --epochs 2 --grid 0.1:on --histories 1,5 --seeds 0 --knn-grid 2:0 --quiet \
            --out "$RUNNER_TEMP/twotower.json"
          signalrec leakage-twotower ml-latest-small --from "$RUNNER_TEMP/twotower.json" --buckets 2 \
            --out "$RUNNER_TEMP/leakage-twotower.json"
      # Day 3 on real data, briefly: retrieval through FAISS, the ranker, and the retrieval benchmark (small sizes).
      - name: Ranking and retrieval smoke run
        run: |
          signalrec ranking ml-latest-small --from "$RUNNER_TEMP/twotower.json" --hidden 0,16 --epochs 2 --quiet \
            --out "$RUNNER_TEMP/ranking.json"
          python scripts/bench_retrieval.py ml-latest-small --from "$RUNNER_TEMP/twotower.json" \
            --synthetic-items 20000 --synthetic-queries 200 --out "$RUNNER_TEMP/retrieval.json"
      # Day 4 on real data: the served model from this run's own two-tower and ranker results, the store, and the
      # serving check, which fails unless the request path gives this run's ranking.json test metrics back exactly
      # (CI's numbers, on CI's CPU: the check compares the run with itself, not with the committed files). Then the
      # latency benchmark and the A/B simulation briefly, to show they run; their numbers aren't kept.
      - name: Serving smoke run
        run: |
          signalrec export ml-latest-small --from "$RUNNER_TEMP/twotower.json" --ranking "$RUNNER_TEMP/ranking.json" \
            --out "$RUNNER_TEMP/model"
          signalrec load-store ml-latest-small --model "$RUNNER_TEMP/model" --fresh
          python scripts/serving_check.py ml-latest-small --model "$RUNNER_TEMP/model" \
            --ranking "$RUNNER_TEMP/ranking.json" --out "$RUNNER_TEMP/serving-check.json"
          python scripts/bench_serving.py ml-latest-small --model "$RUNNER_TEMP/model" --lead-in-requests 50 \
            --seconds 1 --lead-in 0.5 --rates 50 --concurrency 1,2 --client-processes 2 \
            --out "$RUNNER_TEMP/serving-bench.json"
          python scripts/ab_simulate.py ml-latest-small --model "$RUNNER_TEMP/model" --experiments 50 \
            --out "$RUNNER_TEMP/abtest.json"
      # Day 5 on real data, briefly: users held out of training (this run's two-tower configuration), and the new-user
      # path's cost against this run's model and store. Their numbers aren't kept.
      - name: New users smoke run
        run: |
          python scripts/cold_start.py ml-latest-small --source "$RUNNER_TEMP/twotower.json" \
            --out "$RUNNER_TEMP/cold-start.json"
          python scripts/bench_new_users.py ml-latest-small --model "$RUNNER_TEMP/model" --requests 100 --lead-in 10 \
            --out "$RUNNER_TEMP/new-users-bench.json"
